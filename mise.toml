[tools]
go = "1.27.2"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
svu = "3.4.1"
# The pipx backend installs okflint with uv.
uv = "0.13.1"
"pipx:okflint" = "0.5.0"

[tasks.build]
description = "Build rit into bin/"
run = "go build -o bin/rit ./cmd/rit"

[tasks.setup]
description = "Build rit and register kb/ as the ritari project (safe to re-run)"
depends = ["build"]
run = "./bin/rit -p ritari types >/dev/null 2>&1 || ./bin/rit project add ritari ./kb"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.tidy]
description = "Tidy modules"
run = "go mod tidy"

[tasks.archive-tasks]
description = "Archive task notes whose state is done (pass --dry-run to preview)"
run = '''
#!/usr/bin/env bash
# Archive every task note with `state: done`. Archived notes stay linkable but
# drop out of search and move under `# Archived` in tasks/index.md (§5.6).
set -euo pipefail

dry_run=false
if [[ "${1:-}" == "--dry-run" ]]; then
  dry_run=true
elif [[ $# -gt 0 ]]; then
  echo "usage: mise run archive-tasks [--dry-run]" >&2
  exit 2
fi

# Prefer the checkout's binary when it has been built; fall back to PATH.
rit=rit
if [[ -x ./bin/rit ]]; then
  rit=./bin/rit
fi

ids=$("$rit" search --type task --meta state=done --limit 0 | sed -n 's/^id: //p')
if [[ -z "$ids" ]]; then
  echo "no done tasks to archive"
  exit 0
fi

while IFS= read -r id; do
  [[ -z "$id" ]] && continue
  if [[ "$dry_run" == true ]]; then
    echo "would archive $id"
  else
    "$rit" note archive "$id" >/dev/null
    echo "archived $id"
  fi
done <<< "$ids"
'''

[env]
RITARI_PROJECT = "ritari"
