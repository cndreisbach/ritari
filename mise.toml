[tools]
go = "1.27.2"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
svu = "3.4.1"
# The pipx backend installs okflint with uv.
uv = "0.13.1"
"pipx:okflint" = "0.5.0"

[tasks.build]
sources=["./cmd/**/*.go", "./internal/**/*.go", "./go.mod", "./go.sum"]
outputs=["./bin/rit"]
description = "Build rit into bin/"
run = "go build -o bin/rit ./cmd/rit"

[tasks.setup]
description = "Build rit and register kb/ as the ritari project (safe to re-run)"
depends = ["build"]
run = "./bin/rit -p ritari types >/dev/null 2>&1 || ./bin/rit project add ritari ./kb"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.tidy]
description = "Tidy modules"
run = "go mod tidy"

[env]
RITARI_PROJECT = "ritari"
