name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The acceptance tests check every bundle they build with okflint; fail
      # rather than skip if it is missing.
      RITARI_REQUIRE_OKFLINT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go golangci-lint go:golang.org/x/vuln/cmd/govulncheck uv pipx:okflint node
          cache: true
      - name: Test
        run: go test ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Vulnerability check
        run: govulncheck ./...

      - name: Install pi-ritari dependencies
        run: npm ci --prefix pi-ritari
      - name: Typecheck pi-ritari
        run: npm run typecheck --prefix pi-ritari
      - name: Test pi-ritari
        run: npm test --prefix pi-ritari
