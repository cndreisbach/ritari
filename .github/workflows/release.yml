name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Releases run one at a time so two quick merges never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install_args: svu
          cache: true

      - name: Determine version
        id: version
        run: |
          current=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$current" ]; then
            next=v1.0.0
          else
            next=$(svu next)
          fi
          if [ "$next" = "$current" ]; then
            echo "No feat, fix, perf, or breaking commits since $current; nothing to release."
            exit 0
          fi
          echo "Releasing $next (previous: ${current:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "previous=$current" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          .github/scripts/release-notes.sh "$PREVIOUS" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update Homebrew formula
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/src.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          sha256=$(sha256sum "$RUNNER_TEMP/src.tar.gz" | cut -d' ' -f1)
          # Commit on top of the latest main, which may have moved since this run started.
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          .github/scripts/update-formula.sh "${TAG#v}" "$sha256" > Formula/ritari.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ritari.rb
          git commit -m "chore(release): update Homebrew formula to $TAG"
          git push origin main
